<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب خدمات مقراني ماسينيسا — منصة خدمات المواطن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style id="appstyle">
:root{--bg:#f4f6f5;--card:#fff;--ink:#17231f;--mute:#5f6f69;--line:#dfe6e3;--pri:#0f6b4f;--pri2:#e6f2ed;--red:#b3261e;--red2:#fbeceb;--amb:#9a6400;--amb2:#fff4dc;--blu:#1f5fa8;--blu2:#e8f0fa;--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px}
header.top{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
header.top h1{font-size:18px;margin:0;font-weight:800}
header.top small{opacity:.9;display:block;font-size:12px}
header.top .save{margin-inline-start:auto;font-size:12px;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:20px;font-weight:600}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:13px 16px;cursor:pointer;color:var(--mute);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .k{color:var(--mute);font-size:13px}.stat .v{font-size:26px;font-weight:800;margin-top:4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 10px;color:var(--pri)}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--pri);background:#fafcfb}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#0b553e}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.f label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.f textarea{min-height:80px;resize:vertical}
.f.wide{grid-column:1/-1}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--pri2);border-color:var(--pri)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border:2px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;background:#fff;text-align:right}
.cat.on{border-color:var(--pri);background:var(--pri2)}
.cat b{display:block;font-size:16px}.cat span{color:var(--mute);font-size:13px}
.tpls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.sticky{position:sticky;top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{color:var(--mute);font-size:12.5px;font-weight:700;background:#fafcfb}
tr:hover td{background:#fafcfb}
.tbl{overflow-x:auto}
.pager{background:#fff;border-top:1px solid var(--line);padding:12px 4px 2px;margin-top:8px;display:flex;justify-content:flex-start;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}
.s-new{background:var(--blu2);color:var(--blu)}.s-work{background:var(--amb2);color:var(--amb)}.s-ready{background:var(--pri2);color:var(--pri)}.s-done{background:#eee;color:#555}
.paid{color:var(--pri);font-weight:700}.unpaid{color:var(--red);font-weight:700}
.muted{color:var(--mute)}.empty{padding:30px;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal .box{background:#fff;border-radius:var(--r);max-width:920px;width:100%;padding:16px}
.modal .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17231f;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.note{background:var(--amb2);border:1px solid #f0dca8;color:#5e4300;border-radius:10px;padding:10px 12px;font-size:13px}
.oknote{background:var(--pri2);border:1px solid #bfe0d3;color:#0b4f3a;border-radius:10px;padding:10px 12px;font-size:13px}
/* document */
.paperwrap{background:#e9edeb;border-radius:10px;padding:14px;overflow:auto}
.paper{background:#fff;width:100%;max-width:794px;min-height:1020px;margin:0 auto;padding:56px 60px;font-family:Amiri,'Times New Roman',serif;font-size:18px;line-height:2.05;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper .rep{text-align:center;font-weight:700;font-size:19px;margin-bottom:26px}
.paper .dtitle{text-align:center;font-size:30px;font-weight:700;margin:20px 0 4px;text-decoration:underline;text-underline-offset:8px}
.paper .dsub{text-align:center;font-size:19px;margin-bottom:26px;font-weight:700}
.paper p{margin:0 0 4px;text-align:justify}
.paper .lines p{margin:0}
.paper .decl{margin-top:16px;text-indent:24px}
.paper .foot{display:flex;justify-content:space-between;margin-top:38px;gap:20px}
.paper .sig{text-align:center;min-width:220px}
.paper .sig .t{font-weight:700;text-decoration:underline}
.paper .hdr{display:flex;justify-content:space-between;gap:20px;margin-bottom:30px}
.paper .hdr .from p{margin:0}
.paper .to{margin:10px 0 18px;padding-inline-start:38%}
.paper .to p{margin:0}
.paper .subj{margin:16px 0}
.paper .att{margin-top:22px;font-size:16px}
.paper .att ul{margin:4px 0;padding-inline-start:22px}
.paper .legal{margin-top:14px;font-weight:700}
#printZone{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff!important}
  #app,.modal,.toast{display:none!important}
  #printZone{display:block!important}
  #printZone .paper{box-shadow:none!important;margin:0!important;max-width:none!important;width:210mm!important;min-height:297mm!important;padding:20mm 20mm!important}
}
@media (max-width:900px){.split{grid-template-columns:1fr}.sticky{position:static}.cats{grid-template-columns:1fr}.paper{padding:30px 22px;font-size:16px;min-height:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printZone"></div>
<script type="application/json" id="appdata">{"requests":[],"settings":{}}</script>
<script id="appjs">
(function(){
'use strict';
var TITLE='مكتب خدمات مقراني ماسينيسا — منصة خدمات المواطن';
var DEFAULT_OFFICE='مكتب خدمات مقراني ماسينيسا';
var FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">';
var STYLE=document.getElementById('appstyle').textContent;
var JS=document.getElementById('appjs').textContent;
var SC='scr'+'ipt';

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fd(d){if(!d)return '';var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?m[3]+'/'+m[2]+'/'+m[1]:esc(d);}
var BL='……………………';
function V(x){return x&&String(x).trim()?'<b>'+esc(x)+'</b>':BL;}
function D(x){return x?'<b>'+fd(x)+'</b>':'………/………/…………';}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function money(n){return (Number(n)||0).toLocaleString('fr-DZ')+' دج';}
function lines(t){return String(t||'').split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);}

/* ---------- strict local state & persistence ---------- */
var state;
try{state=JSON.parse(document.getElementById('appdata').textContent);}catch(e){state={requests:[],settings:{}};}
try{
  var ls=JSON.parse(localStorage.getItem('csp_state')||'null');
  if(ls&&typeof ls==='object'){
    if(ls.savedAt&&(!state.savedAt||ls.savedAt>=state.savedAt))state=ls;
    else if(Array.isArray(ls.requests)&&ls.requests.length&&(!state.requests||!state.requests.length))state=ls;
  }
}catch(e){}
state.requests=Array.isArray(state.requests)?state.requests:[];
state.settings=Object.assign({
  office:DEFAULT_OFFICE,
  officeAddr:'',
  officePhone:'',
  place:'',
  priceDecl:200,
  priceReq:300,
  seq:0
},state.settings||{});
if(!state.settings.office||state.settings.office==='مكتب خدمات المواطن'){
  state.settings.office=DEFAULT_OFFICE;
}
try{localStorage.setItem('csp_state',JSON.stringify(state));}catch(e){}

var cap=null,readOnly=false,pubTimer=null,saveMsg='محفوظ محلياً ✓';
var ui={tab:'dash',cat:'decl',tpl:'no_work',editId:null,q:'',fs:'',fc:'',page:1,perPage:10};
try{var su=JSON.parse(sessionStorage.getItem('csp_ui')||'null');if(su)Object.assign(ui,su);}catch(e){}

function persist(){
  state.savedAt=Date.now();
  try{
    localStorage.setItem('csp_state',JSON.stringify(state));
    saveMsg='محفوظ محلياً ✓';
  }catch(e){
    saveMsg='تعذر الحفظ المحلي (المساحة ممتلئة)';
  }
  setSave();
  if(cap&&!readOnly){
    clearTimeout(pubTimer);
    pubTimer=setTimeout(function(){
      try{sessionStorage.setItem('csp_ui',JSON.stringify(ui));}catch(e){}
      cap.publish(buildDoc()).then(function(){saveMsg='محفوظ محلياً وسحابياً ✓';setSave();},function(err){
        var c=err&&err.code;
        if(c==='not_granted'||c==='not_writer'){readOnly=true;}
        saveMsg='محفوظ محلياً ✓';
        setSave();
      });
    },1200);
  }
}
function buildDoc(){
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+TITLE+'</title>\n'+FONTS+'\n<style id="appstyle">'+STYLE+'</style>\n</head>\n<body>\n<div id="app"></div>\n<div id="printZone"></div>\n<'+SC+' type="application/json" id="appdata">'+JSON.stringify(state).replace(/</g,'\\u003c')+'</'+SC+'>\n<'+SC+' id="appjs">'+JS+'</'+SC+'>\n</body>\n</html>';
}
function setSave(){var el=document.getElementById('savest');if(el)el.textContent=saveMsg;}

/* ---------- templates ---------- */
var PF=[
 {k:'gender',l:'الجنس',t:'select',o:[['m','ذكر'],['f','أنثى']]},
 {k:'last',l:'اللقب',req:1},{k:'first',l:'الاسم',req:1},
 {k:'birthDate',l:'تاريخ الميلاد',t:'date'},{k:'birthPlace',l:'مكان الميلاد'},
 {k:'father',l:'اسم الأب'},{k:'mother',l:'لقب واسم الأم'},
 {k:'address',l:'العنوان الكامل',wide:0},{k:'profession',l:'المهنة'},
 {k:'idType',l:'نوع الوثيقة',t:'select',o:[['بطاقة التعريف الوطنية البيومترية','بطاقة التعريف الوطنية'],['رخصة السياقة','رخصة السياقة'],['جواز السفر','جواز السفر']]},
 {k:'idNumber',l:'رقم الوثيقة'},{k:'idDate',l:'تاريخ الإصدار',t:'date'},{k:'idIssuer',l:'جهة الإصدار',ph:'مثال: دائرة / بلدية …'},
 {k:'nin',l:'رقم التعريف الوطني NIN (اختياري)'},{k:'phone',l:'رقم الهاتف'}
];
function G(p,m,f){return p.gender==='f'?f:m;}

var DECL={
 no_work:{n:'عدم العمل',sub:'بعدم ممارسة أي نشاط مهني',fields:[{k:'since',l:'منذ تاريخ (اختياري)',t:'date'}],
  txt:function(p,f){return 'أنني لا أمارس أي نشاط مهني أو تجاري أو حرفي، ولا أتقاضى أي أجر أو راتب من أي جهة كانت، عمومية أو خاصة'+(f.since?'، وذلك منذ تاريخ '+D(f.since):'')+'.';}},
 no_income:{n:'عدم وجود دخل',sub:'بانعدام الدخل',fields:[],
  txt:function(p){return 'أنني '+G(p,'بدون','بدون')+' دخل، ولا أتقاضى أي أجر أو منحة أو معاش أو مدخول من أي نشاط كان، سواء داخل الوطن أو خارجه.';}},
 residence:{n:'الإقامة',sub:'بالإقامة',fields:[{k:'resAddress',l:'عنوان الإقامة الفعلية (إن اختلف)'},{k:'since',l:'مقيم منذ',t:'date'}],
  txt:function(p,f){return 'أنني '+G(p,'أقيم','أقيم')+' فعليا وبصفة دائمة بالعنوان: '+V(f.resAddress||p.address)+(f.since?'، وذلك منذ تاريخ '+D(f.since):'')+'.';}},
 single:{n:'عدم الزواج (العزوبة)',sub:'بعدم الزواج',fields:[],
  txt:function(p){return 'أنني '+G(p,'أعزب','عزباء')+'، ولم يسبق لي الزواج إلى غاية تاريخ تحرير هذا التصريح.';}},
 no_remarry:{n:'عدم إعادة الزواج',sub:'بعدم إعادة الزواج',fields:[{k:'reason',l:'السبب',t:'select',o:[['death','وفاة الزوج(ة)'],['divorce','الطلاق']]},{k:'spouse',l:'اسم ولقب الزوج(ة) السابق(ة)'},{k:'eventDate',l:'تاريخ الوفاة / الطلاق',t:'date'}],
  txt:function(p,f){var d=f.reason==='divorce';return 'أنني لم '+G(p,'أُعِد','أُعِد')+' الزواج بعد '+(d?'طلاقي من ':'وفاة '+G(p,'زوجتي','زوجي')+' ')+V(f.spouse)+' بتاريخ '+D(f.eventDate)+'، وأنني لا أزال '+(d?G(p,'مطلقا','مطلقة'):G(p,'أرملا','أرملة'))+' إلى غاية تاريخ تحرير هذا التصريح.';}},
 no_housing:{n:'عدم الاستفادة من سكن',sub:'بعدم الاستفادة من سكن أو إعانة الدولة',fields:[{k:'spouse',l:'اسم ولقب الزوج(ة) (إن وجد)'}],
  txt:function(p,f){return 'أنني لم '+G(p,'أستفد','أستفد')+(f.spouse?'، لا أنا ولا '+G(p,'زوجتي','زوجي')+' '+V(f.spouse)+'،':'')+' من أي سكن عمومي إيجاري أو مدعم أو ترقوي، ولا من أي إعانة مالية من الدولة لغرض السكن أو البناء الريفي، ولا أملك أي عقار ذي استعمال سكني أو قطعة أرض صالحة للبناء.';}},
 no_property:{n:'عدم امتلاك عقار',sub:'بعدم امتلاك عقار',fields:[],
  txt:function(){return 'أنني لا أملك أي عقار، سواء كان سكنا أو محلا أو قطعة أرض، عبر كامل التراب الوطني.';}},
 dependent:{n:'التكفل العائلي',sub:'بالتكفل',fields:[{k:'depName',l:'اسم ولقب المتكفل به'},{k:'relation',l:'صلة القرابة',ph:'مثال: والدي، ابني…'},{k:'depBirth',l:'تاريخ ميلاده',t:'date'}],
  txt:function(p,f){return 'أنني '+G(p,'أتكفل','أتكفل')+' كليا ماديا ومعنويا بـ: '+V(f.depName)+' بصفته ('+V(f.relation)+')، '+G(p,'','')+'المولود(ة) بتاريخ '+D(f.depBirth)+'، والذي يعيش تحت كفالتي ورعايتي.';}},
 no_commerce:{n:'عدم امتلاك سجل تجاري',sub:'بعدم امتلاك سجل تجاري',fields:[],
  txt:function(p){return 'أنني غير '+G(p,'مسجل','مسجلة')+' في السجل التجاري ولا في سجل الصناعة التقليدية والحرف، ولا أمارس أي نشاط تجاري أو حرفي بصفة رسمية.';}},
 loss:{n:'ضياع وثيقة',sub:'بضياع وثيقة',fields:[{k:'docType',l:'نوع الوثيقة الضائعة'},{k:'docNumber',l:'رقمها'},{k:'docIssuer',l:'الجهة المصدرة'},{k:'lossDate',l:'تاريخ الضياع',t:'date'},{k:'lossPlace',l:'مكان الضياع'}],
  txt:function(p,f){return 'أنني '+G(p,'أضعت','أضعت')+' الوثيقة التالية: '+V(f.docType)+' رقم '+V(f.docNumber)+' الصادرة عن '+V(f.docIssuer)+'، وذلك بتاريخ '+D(f.lossDate)+' بمكان '+V(f.lossPlace)+'، وأنني لم أتنازل عنها ولم أرهنها لأي شخص كان.';}},
 loss_violation:{
  n:'ضياع مخالفة (شرطة / درك وطني)',
  sub:'بضياع وصل مخالفة مرورية',
  fields:[
    {k:'authority',l:'الجهة المحررة للمخالفة',t:'select',o:[['مصالح الشرطة (الأمن الوطني)','مصالح الشرطة (الأمن الوطني)'],['مصالح الدرك الوطني','مصالح الدرك الوطني']]},
    {k:'violationNum',l:'رقم المخالفة / الوصل (إن وجد)',ph:'مثال: 1452/2026'},
    {k:'violationDate',l:'تاريخ تحرير المخالفة',t:'date'},
    {k:'violationPlace',l:'مكان المخالفة / الحاجز',ph:'مثال: الحاجز الأمني / الطريق الوطني رقم…'},
    {k:'withdrawnDoc',l:'الوثيقة المسحوبة',t:'select',o:[['رخصة السياقة','رخصة السياقة'],['البطاقة الرمادية (شهادة ترقيم المركبة)','البطاقة الرمادية (شهادة ترقيم المركبة)'],['وثائق أخرى','وثائق أخرى']]},
    {k:'vehiclePlate',l:'رقم تسجيل المركبة (الترقيم)',ph:'مثال: 12345-116-16'},
    {k:'lossDate',l:'تاريخ الضياع',t:'date'},
    {k:'lossPlace',l:'مكان الضياع',ph:'مثال: وسط المدينة / المنزل…'}
  ],
  txt:function(p,f){
    var auth=f.authority||'مصالح الشرطة (الأمن الوطني)';
    var wdoc=f.withdrawnDoc||'رخصة السياقة';
    return 'أنني '+G(p,'أضعت','أضعت')+' وصل المخالفة (محضر المخالفة / وصل الاحتفاظ) المحرر من طرف '+V(auth)+
      (f.violationNum&&String(f.violationNum).trim()?' تحت رقم '+V(f.violationNum):' تحت رقم '+BL)+
      ' بتاريخ '+D(f.violationDate)+' بـ '+V(f.violationPlace)+
      '، والمتعلق بسحب '+V(wdoc)+' للمركبة ذات الترقيم '+V(f.vehiclePlate)+
      '، وذلك بتاريخ '+D(f.lossDate)+' بـ '+V(f.lossPlace)+
      '، وأنني لم أتنازل عنه ولم أرهنه لأي جهة كانت، وأتحمل كامل المسؤولية القانونية في حال العثور عليه أو ثبوت عكس ذلك.';
  }
 },
 loss_bio_receipt:{
  n:'ضياع وصل استلام (بطاقة التعريف / رخصة السياقة / جواز السفر البيومتري)',

/* ---------- direct print engine ---------- */
function printDoc(r){
  if(!r)return;
  var pz=document.getElementById('printZone');
  if(pz){
    pz.innerHTML=renderDoc(r);
  }
  try{
    setTimeout(function(){
      window.print();
    },80);
  }catch(e){
    var w=window.open('','_blank');
    if(w){
      w.document.open();
      w.document.write(printableHTML(r));
      w.document.close();
      w.focus();
      setTimeout(function(){try{w.print();}catch(ex){}},350);
    }else{
      toast('تعذر فتح نافذة الطباعة');
    }
  }
}

function render(){
  var h=header()+'<main>';
  if(ui.tab==='dash')h+=viewDash();
  else if(ui.tab==='new')h+=viewNew();
  else if(ui.tab==='list')h+=viewList();
  else if(ui.tab==='clients')h+=viewClients();
  else h+=viewSettings();
  app.innerHTML=h+'</main>';
  if(ui.tab==='new')updatePreview();
}
function viewDash(){
  var R=state.requests,td=today();
  var c=function(fn){return R.filter(fn).length;};
  var rev=R.reduce(function(a,r){return a+(r.paid?Number(r.price)||0:0);},0);
  var due=R.reduce(function(a,r){return a+(!r.paid?Number(r.price)||0:0);},0);
  var h='<div class="grid stats">'+
   st('إجمالي الطلبات',R.length)+st('طلبات اليوم',c(function(r){return r.date===td||(r.createdAt||'').slice(0,10)===td;}))+
   st('قيد الانتظار',c(function(r){return r.status==='new'||r.status==='work';}))+st('جاهزة للتسليم',c(function(r){return r.status==='ready';}))+
   st('المداخيل المحصلة',money(rev))+st('مبالغ غير مدفوعة',money(due))+'</div>';
  var counts={};R.forEach(function(r){var n=docName(r);counts[n]=(counts[n]||0)+1;});
  var top=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).slice(0,6);
  h+='<div class="split" style="margin-top:16px"><div class="card"><div class="row" style="justify-content:space-between"><h2>آخر الطلبات</h2><button class="btn pri" data-act="new">+ طلب جديد</button></div>'+table(R.slice().reverse().slice(0,8),true)+'</div>'+
   '<div class="card"><h2>الوثائق الأكثر طلبا</h2>'+(top.length?'<table>'+top.map(function(n){return '<tr><td>'+esc(n)+'</td><td style="width:60px"><b>'+counts[n]+'</b></td></tr>';}).join('')+'</table>':'<div class="empty">لا توجد طلبات بعد</div>')+
   '<h3>ملاحظة قانونية</h3><div class="note">التصريح الشرفي وثيقة يصرح فيها المعني بمسؤوليته الشخصية، وتتم المصادقة على الإمضاء لدى مصالح البلدية أو الملحقة الإدارية بحضور المعني شخصيا مع وثيقة الهوية. التصريح الكاذب يعرض صاحبه للمتابعة الجزائية. يُستحسن التأكد من الصيغة المطلوبة لدى الإدارة المعنية قبل الطباعة.</div></div></div>';
  return h;
  function st(k,v){return '<div class="card stat"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div></div>';}
}
function table(rows,compact){
  if(!rows.length)return '<div class="empty">لا توجد طلبات</div>';
  return '<div class="tbl"><table><thead><tr><th>الرقم</th><th>الزبون</th><th>الوثيقة</th>'+(compact?'':'<th>التاريخ</th><th>السعر</th><th>الدفع</th>')+'<th>الحالة</th><th></th></tr></thead><tbody>'+
  rows.map(function(r){return '<tr><td class="muted">'+esc(r.num)+'</td><td><b>'+esc(fullName(r.person||{})||'—')+'</b>'+(compact?'':'<br><small class="muted" dir="ltr">'+esc((r.person||{}).phone||'')+'</small>')+'</td><td>'+esc(docName(r))+'</td>'+
   (compact?'':'<td>'+fd(r.date)+'</td><td>'+money(r.price)+'</td><td><button class="btn sm" data-act="paid" data-id="'+r.id+'"><span class="'+(r.paid?'paid':'unpaid')+'">'+(r.paid?'مدفوع ✓':'غير مدفوع')+'</span></button></td>')+
   '<td>'+(compact?'<span class="badge s-'+r.status+'">'+stName(r.status)+'</span>':'<select data-act="status" data-id="'+r.id+'">'+STATUS.map(function(s){return '<option value="'+s[0]+'"'+(r.status===s[0]?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select>')+'</td>'+
   '<td style="white-space:nowrap"><button class="btn sm" data-act="view" data-id="'+r.id+'">عرض</button> <button class="btn sm" data-act="print" data-id="'+r.id+'" title="طباعة مباشرة A4">🖨️ طباعة</button> '+(compact?'':'<button class="btn sm" data-act="edit" data-id="'+r.id+'">تعديل</button> <button class="btn sm" data-act="dup" data-id="'+r.id+'" title="وثيقة جديدة لنفس الزبون">+ وثيقة</button> <button class="btn sm danger" data-act="del" data-id="'+r.id+'">حذف</button>')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function viewList(){
  var q=ui.q.trim().toLowerCase();
  var filtered=state.requests.filter(function(r){
    if(ui.fs&&r.status!==ui.fs)return false;if(ui.fc&&r.cat!==ui.fc)return false;
    if(q){var s=(r.num+' '+fullName(r.person||{})+' '+((r.person||{}).phone||'')+' '+((r.person||{}).idNumber||'')+' '+docName(r)).toLowerCase();if(s.indexOf(q)<0)return false;}
    return true;}).reverse();
  var total=filtered.length;
  var pages=Math.max(1,Math.ceil(total/ui.perPage));
  if(ui.page>pages)ui.page=pages;
  if(ui.page<1)ui.page=1;
  var start=(ui.page-1)*ui.perPage;
  var rows=filtered.slice(start,start+ui.perPage);
  var pager='';
  if(total>ui.perPage){
    pager='<div class="pager">'+
      '<button class="btn sm" data-act="page" data-v="'+(ui.page-1)+'"'+(ui.page<=1?' disabled':'')+'>السابق</button>'+
      '<span class="muted" style="font-size:13px">صفحة <b>'+ui.page+'</b> من <b>'+pages+'</b></span>'+
      '<button class="btn sm" data-act="page" data-v="'+(ui.page+1)+'"'+(ui.page>=pages?' disabled':'')+'>التالي</button>'+
    '</div>';
  }
  return '<div class="card"><div class="row" style="margin-bottom:12px"><div class="f" style="flex:1;min-width:200px"><input id="q" placeholder="بحث بالاسم، الهاتف، رقم البطاقة، رقم الطلب…" value="'+esc(ui.q)+'"></div>'+
  '<div class="f"><select id="fs"><option value="">كل الحالات</option>'+STATUS.map(function(s){return '<option value="'+s[0]+'"'+(ui.fs===s[0]?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select></div>'+
  '<div class="f"><select id="fc"><option value="">كل الأنواع</option><option value="decl"'+(ui.fc==='decl'?' selected':'')+'>تصاريح شرفية</option><option value="req"'+(ui.fc==='req'?' selected':'')+'>طلبات خطية</option></select></div>'+
  '<button class="btn" data-act="csv">تصدير CSV</button><button class="btn pri" data-act="new">+ طلب جديد</button></div><div class="muted" style="font-size:13px;margin-bottom:6px">'+total+' طلب</div>'+table(rows,false)+pager+'</div>';
}
function clientsList(){
  var map={};
  state.requests.forEach(function(r){var p=r.person||{};var key=(p.idNumber||'')+'|'+fullName(p)+'|'+(p.phone||'');if(!fullName(p))return;
    if(!map[key])map[key]={p:p,n:0,last:'',due:0,key:key};map[key].n++;map[key].p=p;if((r.date||'')>map[key].last)map[key].last=r.date||'';if(!r.paid)map[key].due+=Number(r.price)||0;});
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return fullName(a.p).localeCompare(fullName(b.p),'ar');});
}

  var C=clientsList();

  C.map(function(c,i){return '<tr><td><b>'+esc(fullName(c.p))+'</b></td><td dir="ltr" style="text-align:right">'+esc(c.p.phone||'')+'</td><td>'+esc(c.p.idNumber||'')+'</td><td>'+c.n+'</td><td>'+fd(c.last)+'</td><td class="'+(c.due?'unpaid':'')+'">'+(c.due?money(c.due):'—')+'</td><td><button class="btn sm pri" data-act="newfor" data-i="'+i+'">+ وثيقة جديدة</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">يظهر الزبائن هنا تلقائيا بعد تسجيل أول طلب</div>')+'</div>';
}

function readForm(){
  if(!draft)return;
  document.querySelectorAll('[data-g]').forEach(function(el){
    var g=el.getAttribute('data-g'),k=el.getAttribute('data-k'),v=el.value;
    if(g==='p_')draft.person[k]=v;else if(g==='f_')draft.f[k]=v;
    else if(g==='m_'){if(k==='paid')draft.paid=v==='1';else if(k==='price')draft.price=Number(v)||0;else draft[k]=v;}
  });
}
function updatePreview(){var el=document.getElementById('preview');if(el&&draft)el.innerHTML=renderDoc(draft);}

/* ---------- actions ---------- */
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);}
function modal(html){var m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+html+'</div>';m.addEventListener('click',function(e){if(e.target===m)m.remove();});document.body.appendChild(m);return m;}
function confirmBox(msg,ok){var m=modal('<p style="font-size:16px;margin-top:0">'+esc(msg)+'</p><div class="row"><button class="btn danger" id="cy">نعم، احذف</button><button class="btn" id="cn">إلغاء</button></div>');m.querySelector('.box').style.maxWidth='420px';m.querySelector('#cy').onclick=function(){m.remove();ok();};m.querySelector('#cn').onclick=function(){m.remove();};}
function find(id){for(var i=0;i<state.requests.length;i++)if(state.requests[i].id===id)return state.requests[i];}
var dl=null;
function saveFile(name,data,mime){
  if(dl){
    dl.save({filename:name,data:data}).then(function(){toast('تم التحميل ✓');},function(e){if(e&&e.code!=='declined')blobDownload(name,data,mime);});
    return;
  }
  blobDownload(name,data,mime);
}
function blobDownload(name,data,mime){
  try{
    var blob=new Blob([data],{type:mime||'text/plain;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(url);},250);
    toast('تم التحميل ✓');
  }catch(e){
    toast('تعذر التحميل');
  }
}
function fileSafe(s){return String(s).replace(/[\\/:*?"<>|]+/g,'-').slice(0,90);}
function copyTextFallback(txt){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    var ok=document.execCommand('copy');
    ta.remove();
    if(ok){toast('تم نسخ النص ✓');return;}
  }catch(e){}
  try{navigator.clipboard.writeText(txt).then(function(){toast('تم نسخ النص ✓');},function(){toast('تعذر النسخ');});}catch(err){toast('تعذر النسخ');}
}
function viewDoc(r){
  if(!r)return;
  var m=modal('<div class="bar"><b style="font-size:16px">'+esc(docName(r))+'</b><span class="muted">'+esc(r.num)+' — '+esc(fullName(r.person||{}))+'</span><span style="flex:1"></span>'+
   '<button class="btn pri" data-m="directprint">🖨️ طباعة مباشرة</button>'+
   '<button class="btn" data-m="html">⬇️ حفظ HTML</button>'+
   '<button class="btn" data-m="copy">نسخ النص</button>'+
   '<button class="btn" data-m="edit">تعديل</button>'+
   '<button class="btn" data-m="close">إغلاق</button></div>'+
   '<div class="row" style="margin-bottom:10px"><span class="muted">الحالة:</span>'+STATUS.map(function(s){return '<button class="btn sm'+(r.status===s[0]?' pri':'')+'" data-st="'+s[0]+'">'+s[1]+'</button>';}).join('')+'</div>'+
   '<div class="paperwrap">'+renderDoc(r)+'</div>');
  m.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var a=b.getAttribute('data-m'),st=b.getAttribute('data-st');
    if(st){r.status=st;persist();m.remove();render();viewDoc(r);return;}
    if(a==='close')m.remove();
    else if(a==='directprint')printDoc(r);
    else if(a==='html')saveFile(fileSafe(r.num+' '+docName(r)+' '+fullName(r.person||{}))+'.html',printableHTML(r),'text/html;charset=utf-8');
    else if(a==='copy')copyTextFallback(docText(r));
    else if(a==='edit'){m.remove();startEdit(r);}
  });
}
function startEdit(r){draft=JSON.parse(JSON.stringify(r));ui.editId=r.id;ui.cat=r.cat;ui.tpl=r.tpl;ui.tab='new';render();window.scrollTo(0,0);}
function saveDraft(){
  readForm();var d=draft;
  if(!fullName(d.person)){toast('يرجى إدخال اللقب والاسم');return null;}
  if(d.cat==='req'&&!d.f.subject)d.f.subject='';
  if(d.id){var o=find(d.id);Object.assign(o,JSON.parse(JSON.stringify(d)),{updatedAt:new Date().toISOString()});d=o;}
  else{state.settings.seq=(state.settings.seq||0)+1;d.id=uid();d.num=new Date().getFullYear()+'-'+String(state.settings.seq).padStart(4,'0');d.createdAt=new Date().toISOString();state.requests.push(JSON.parse(JSON.stringify(d)));d=find(d.id);}
  persist();
  var saved=d;draft=null;ui.editId=null;toast('تم حفظ الطلب '+saved.num+' ✓');return saved;
}
function toCSV(){
  var head=['الرقم','التاريخ','اللقب','الاسم','الهاتف','رقم البطاقة','النوع','الوثيقة','السعر','الدفع','الحالة','ملاحظات'];
  var q=function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';};
  return '\ufeff'+[head.map(q).join(',')].concat(state.requests.map(function(r){var p=r.person||{};return [r.num,r.date,p.last,p.first,p.phone,p.idNumber,r.cat==='decl'?'تصريح شرفي':'طلب خطي',docName(r),r.price,r.paid?'مدفوع':'غير مدفوع',stName(r.status),r.notes].map(q).join(',');})).join('\r\n');
}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-tab],[data-act]');if(!b||b.tagName==='SELECT')return;
  var tab=b.getAttribute('data-tab');
  if(tab){if(ui.tab==='new')readForm();ui.tab=tab;render();return;}
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(a==='new'){draft=null;ui.editId=null;ui.tab='new';render();}
  else if(a==='cat'){readForm();draft.cat=ui.cat=b.getAttribute('data-v');var T=draft.cat==='decl'?DECL:REQ;ui.tpl=draft.tpl=Object.keys(T)[0];draft.price=draft.cat==='decl'?state.settings.priceDecl:state.settings.priceReq;render();}
  else if(a==='tpl'){readForm();draft.tpl=ui.tpl=b.getAttribute('data-v');render();}
  else if(a==='save'){if(saveDraft()){ui.tab='list';ui.page=1;render();}}
  else if(a==='saveview'){var s=saveDraft();if(s){ui.tab='list';ui.page=1;render();viewDoc(s);}}
  else if(a==='saveprint'){var sp=saveDraft();if(sp){ui.tab='list';ui.page=1;render();printDoc(sp);}}
  else if(a==='printdraft'){readForm();printDoc(draft);}
  else if(a==='reset'){draft=null;ui.editId=null;render();}
  else if(a==='view')viewDoc(find(id));
  else if(a==='print')printDoc(find(id));
  else if(a==='edit')startEdit(find(id));
  else if(a==='dup'){var r=find(id);draft=newDraft(JSON.parse(JSON.stringify(r.person)));ui.editId=null;ui.tab='new';render();window.scrollTo(0,0);}
  else if(a==='newfor'){var c=clientsList()[+b.getAttribute('data-i')];draft=newDraft(JSON.parse(JSON.stringify(c.p)));ui.editId=null;ui.tab='new';render();}
  else if(a==='paid'){var r2=find(id);r2.paid=!r2.paid;persist();render();}
  else if(a==='del'){var r3=find(id);confirmBox('حذف الطلب '+r3.num+' الخاص بـ '+fullName(r3.person||{})+'؟',function(){state.requests=state.requests.filter(function(x){return x.id!==id;});persist();render();toast('تم الحذف');});}
  else if(a==='page'){ui.page=Number(b.getAttribute('data-v'))||1;render();}
  else if(a==='csv')saveFile('سجل-الطلبات-'+today()+'.csv',toCSV(),'text/csv;charset=utf-8');
  else if(a==='backup')saveFile('نسخة-احتياطية-مكتب-مقراني-'+today()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');
  else if(a==='savesettings'){document.querySelectorAll('[data-g="s_"]').forEach(function(el){var k=el.getAttribute('data-k');state.settings[k]=el.type==='number'?Number(el.value)||0:el.value;});persist();render();toast('تم حفظ الإعدادات ✓');}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ui.q=t.value;ui.page=1;var pos=t.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(x){}return;}
  if(ui.tab==='new'&&t.getAttribute('data-g')){readForm();updatePreview();}
});
app.addEventListener('change',function(e){
  var t=e.target,a=t.getAttribute('data-act');
  if(t.id==='fs'){ui.fs=t.value;ui.page=1;render();}
  else if(t.id==='fc'){ui.fc=t.value;ui.page=1;render();}
  else if(a==='status'){find(t.getAttribute('data-id')).status=t.value;persist();toast('تم تحديث الحالة');}
  else if(a==='pick'&&t.value!==''){readForm();draft.person=JSON.parse(JSON.stringify(clientsList()[+t.value].p));render();toast('تم ملء معلومات الزبون');}
  else if(ui.tab==='new'&&t.getAttribute('data-g')){readForm();updatePreview();}
  else if(t.id==='restore'&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var s=JSON.parse(rd.result);
        if(!s||!Array.isArray(s.requests))throw 0;
        var byId={},byNum={};
        state.requests.forEach(function(r){if(r.id)byId[r.id]=r;if(r.num)byNum[r.num]=r;});
        var added=0,updated=0;
        s.requests.forEach(function(inc){
          if(!inc||typeof inc!=='object')return;
          var existing=(inc.id&&byId[inc.id])||(inc.num&&byNum[inc.num]);
          if(existing){
            Object.assign(existing,inc);
            updated++;
          }else{
            if(!inc.id)inc.id=uid();
            state.requests.push(inc);
            byId[inc.id]=inc;
            if(inc.num)byNum[inc.num]=inc;
            added++;
          }
        });
        if(s.settings&&typeof s.settings==='object'){
          var maxSeq=Math.max(Number(state.settings.seq)||0,Number(s.settings.seq)||0);
          state.settings=Object.assign({},s.settings,state.settings,{seq:maxSeq});
        }
        persist();
        render();
        toast('تم دمج '+added+' طلب جديد وتحديث '+updated+' طلب دون حذف أي سجل ✓');
      }catch(x){toast('ملف غير صالح');}
    };
    rd.readAsText(t.files[0]);
  }
});

render();
try{sessionStorage.removeItem('csp_ui');}catch(e){}
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(c){if(c){cap=c;saveMsg='محفوظ محلياً وسحابياً ✓';setSave();}}).catch(function(){});
  window.claude.use('downloads').then(function(d){if(d){dl=d;if(ui.tab!=='new')render();}}).catch(function(){});
}
})();
</script>
</body>
</html>
